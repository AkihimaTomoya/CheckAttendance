<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Face Recognition</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="brand">
        <div class="logo-dot"></div>
        <h1>Face Recognition</h1>
      </div>

      <div class="toolbar">
        <label class="row chk toggle" title="Display bbox & name">
          <input id="overlayChk" type="checkbox" checked />
        </label>

          <div class="btn-group">
            <button id="toggleCameraBtn" type="button" class="btn">Turn on camera</button>
            <button id="reloadFacebankBtn" type="button" class="btn secondary">Reload Facebank</button>
          </div>

          <span id="connectionStatus" class="pill warn">Not Connected</span>
        </div>

        <!-- Nhóm trạng thái cố định kích thước bên phải -->
        <div class="status-group">
          <span id="status" class="status-badge">Ready.</span>
          <span id="debugLine" class="status-badge debug-badge" aria-live="polite"></span>
        </div>
      </div>
    </header>

    <section id="mediaWrap" class="media">
      <video id="videoStream" autoplay muted playsinline></video>
      <canvas id="canvasOverlay"></canvas>
    </section>
  </div>

  <script defer src="/static/js/fastapi.js"></script>
</body>
</html>
